# thermo-shield-ai backend — Python dependencies (prototype)

[project]
name = "thermo-shield-ai-backend"
version = "0.1.0"
description = "Heatwave early-warning backend (prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pythermalcomfort>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx",
]
